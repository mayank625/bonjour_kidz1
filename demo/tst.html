  <style>
    .user-icon {
      font-size: 20px;
      border-radius: 50%;

      display: inline-block;
      margin: 0 10px;

      height: 40px;
      text-align: center;

    }

    .user-red {
      background-color: #e74c3c;
    }

    .user-blue {
      background-color: #3498db;
    }

    .user-green {

    }

    .user-orange {

    }
    .user-purple {

    }
    .user-yellow {

    .user-pink {

    body {
      margin: 0;
      background: linear-gradient(-45deg, #f0f4f8, #ffe8e0, #fff0ea, #f0f4f8), url('img/download2.jfif');
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      font-family: 'Roboto', sans-serif;
      color: #2c3e50;
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 40px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      margin: 40px;
    }

    .comments-section {
      flex: 1;
      width: 100%;
    }

    .tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 8px 16px;
      border: 2px solid #FE5D37;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      color: #FE5D37;
      background-color: white;
      transition: all 0.3s ease;
    }

    .tab.active {
      background-color: #FE5D37;
      color: rgb(0, 0, 0);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      /* Space between cards */
      padding: 20px;
      /* Add padding around the cards section */
    }

    .card {
      min-width: 320px;
      background-color: #fff;
      border-radius: 16px;
      padding: 20px;
      /* Padding inside the card */
      position: relative;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      overflow: hidden;
      color: rgb(0, 0, 0);
      margin: 10px;
      /* Add margin around each card */
    }

    /* Background image behind content using CSS variable */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: var(--bg-img);
      background-size: cover;
      background-position: center;
      opacity: 0;
      /* Hidden by default */
      transition: opacity 0.3s ease;
      z-index: 0;
      border-radius: 16px;
    }

    /* Show background on hover */
    .card:hover::before {
      opacity: 0.4;
      /* Show on hover */
    }

    .card>* {
      position: relative;
      z-index: 1;
    }

    .user {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      color: #000;
      /* fixed color */
    }

    .user img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .username {
      font-weight: bold;
    }

    .role-time {
      font-size: 12px;
      color: #000000;
    }

    .comment {
      margin: 10px 0;
    }

    .toggle {
      position: absolute;
      top: 20px;
      right: 40px;
      font-size: 14px;
      color: #2c3e50;
      user-select: none;
    }

    .toggle input[type="checkbox"] {
      display: none;
    }

    .toggle-label {
      background: #ffcab8;
      border-radius: 20px;
      display: inline-block;
      width: 40px;
      height: 20px;
      position: relative;
      vertical-align: middle;
      margin-left: 8px;
      cursor: pointer;
    }

    .toggle-label::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: #FE5D37;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: 0.3s;
    }

    input[type="checkbox"]:checked+.toggle-label::before {
      transform: translateX(20px);
    }
  </style>
</head>
