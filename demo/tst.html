<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Franchisee Enquiry Form with Close Button</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

<div class="container-xxl py-5">
    <div class="container">
        <div class="bg-light rounded">
            <div class="row g-0">
                <div class="col-lg-6 wow fadeIn" data-wow-delay="0.1s">
                    <div class="h-100 d-flex flex-column justify-content-center p-5">
                        <h1 class="mb-4">Franchisee Enquiry Form</h1>
                        <form id="joinUsForm">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" placeholder="Enter Name:" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter Email:" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Mobile</label>
                                <input type="tel" class="form-control" id="phone" placeholder="Phone No:" maxlength="10" required>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" rows="3" required></textarea>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-danger me-2">Submit</button>
                                <button type="button" class="btn btn-secondary" id="closeBtn">Close</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="col-lg-6 wow fadeIn" data-wow-delay="0.5s" style="min-height: 400px;">
                    <div class="position-relative h-100">
                        <img class="position-absolute w-80 h-100 rounded" src="img/preschool.png" alt="Preschool image" style="object-fit: cover;">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Get the form container so we can hide/show it
    const formContainer = document.querySelector('.bg-light.rounded');
    const closeBtn = document.getElementById('closeBtn');

    closeBtn.addEventListener('click', () => {
        // Hide the entire form container on close
        formContainer.style.display = 'none';
    });
</script>

</body>
</html>
