<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>futr Design</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

 
</head>
<body>

 <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      padding-bottom: 60px; /* Prevent content from hiding behind fixed futr */
    }

    .futr {
      background-color: #ff6f61;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      bottom: 0;
      width: 100%;
      z-index: 100;
      border: 1px solid #ccc;
      box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.2);
      flex-wrap: wrap;
    }

    .futr > div {
      max-width: 100%;
    }

    .futr .social-icons {
      display: flex;
      gap: 15px;
      flex-shrink: 0;
    }

    .futr .social-icons a {
      color: white;
      font-size: 20px;
      text-decoration: none;
    }

    .futr .action-links {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-shrink: 1;
      flex-wrap: wrap;
      justify-content: center;
      background-color: #FF9E7D;
      padding: 10px;
      border-top-left-radius:20px ;
      border-top-Right-radius:20px ;
      margin-bottom: -10px;
    }

    .futr .action-links a {
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      white-space: nowrap;
    }

    .futr .action-links a img {
      width: 18px;
      height: 18px;
    }

    .futr .slash {
      transform: rotate(15deg);
      font-size: 18px;
      opacity: 0.6;
    }

    .futr .right-end {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .futr .right-end h1 {
      margin: 0;
      font-size: 14px;
    }

   @media (max-width: 600px) {
  .futr .social-icons,
  .futr .right-end {
    display: none;
  }

  .futr {
    justify-content: center;
    padding: 12px 10px;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
  }

  .futr .action-links {
    gap: 10px;
    flex-wrap: wrap;
  }
}

  </style>
  <!-- futr -->
  <div class="futr">
    <!-- Social Media Icons -->
    <div class="social-icons">
  <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
  <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
</div>


    <!-- Action Links with icons and slash -->
    <div class="action-links">
      <a href="#"><img src="img/admission_icon.png" alt="Admission Icon" /> Admission Enquiry</a>
      <div class="slash">/</div>
      <a href="#"><img src="img/start-a-franchise.png" alt="Franchise Icon" /> Start a Franchise</a>
    </div>

    <!-- Right End Section -->
    <div class="right-end">
      <h1>Right End</h1>
    </div>
  </div>

</body>
</html>
