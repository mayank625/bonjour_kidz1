<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spooky Halloween</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(#000000, #0a0a0a);
    }
    canvas {
      display: block;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="halloweenCanvas"></canvas>
  <script>
    function initHalloweenCanvas() {
      const canvas = document.getElementById("halloweenCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let animationId;
      const pumpkins = [];
      const bats = [];
      const sparkles = [];
      const fogLayers = [];

      class Pumpkin {
        constructor(x, y, size) {
          this.x = x;
          this.y = y;
          this.size = size;
          this.alpha = 0;
          this.jitter = Math.random() * 2;
        }

        update() {
          this.alpha = Math.min(this.alpha + 0.01, 1);
          this.y += Math.sin(Date.now() / 300 + this.x) * 0.1;
        }

        draw() {
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.fillStyle = "darkorange";
          ctx.beginPath();
          ctx.ellipse(this.x, this.y, this.size, this.size * 0.8, 0.1 * Math.sin(Date.now() / 500), 0, Math.PI * 2);
          ctx.fill();

          // Eyes
          ctx.fillStyle = "red";
          ctx.beginPath();
          ctx.moveTo(this.x - this.size / 3, this.y - this.size / 4);
          ctx.lineTo(this.x - this.size / 4, this.y - this.size / 2);
          ctx.lineTo(this.x - this.size / 6, this.y - this.size / 4);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(this.x + this.size / 3, this.y - this.size / 4);
          ctx.lineTo(this.x + this.size / 4, this.y - this.size / 2);
          ctx.lineTo(this.x + this.size / 6, this.y - this.size / 4);
          ctx.closePath();
          ctx.fill();

          // Jagged mouth
          ctx.beginPath();
          ctx.moveTo(this.x - this.size / 2.5, this.y + this.size / 5);
          for (let i = 0; i < 5; i++) {
            ctx.lineTo(this.x - this.size / 2.5 + i * (this.size / 5), this.y + this.size / 5 + ((i % 2 === 0) ? 10 : -10));
          }
          ctx.lineTo(this.x + this.size / 2.5, this.y + this.size / 5);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      class Bat {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height * 0.5;
          this.size = 20 + Math.random() * 20;
          this.speedX = -1.5 + Math.random() * 3;
          this.speedY = -0.5 + Math.random();
          this.angle = 0;
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          this.angle += 0.1;
          if (this.x < -50 || this.x > canvas.width + 50 || this.y < -50 || this.y > canvas.height + 50) {
            this.x = Math.random() * canvas.width;
            this.y = canvas.height * 0.5 + Math.random() * canvas.height * 0.5;
          }
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(Math.sin(this.angle) * 0.5);
          ctx.fillStyle = "black";
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(-this.size, -this.size / 2);
          ctx.lineTo(-this.size / 2, 0);
          ctx.lineTo(-this.size, this.size / 2);
          ctx.lineTo(0, 0);
          ctx.lineTo(this.size, -this.size / 2);
          ctx.lineTo(this.size / 2, 0);
          ctx.lineTo(this.size, this.size / 2);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      class Sparkle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2 + 1;
          this.alpha = Math.random();
          this.speedY = 0.5 + Math.random();
        }

        update() {
          this.y -= this.speedY;
          this.alpha -= 0.01;
          if (this.alpha <= 0) {
            this.x = Math.random() * canvas.width;
            this.y = canvas.height;
            this.alpha = 1;
          }
        }

        draw() {
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.fillStyle = "white";
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawFog() {
        const gradient = ctx.createRadialGradient(
          canvas.width / 2, canvas.height / 2, 0,
          canvas.width / 2, canvas.height / 2, canvas.width
        );
        gradient.addColorStop(0, "rgba(50,50,50,0.1)");
        gradient.addColorStop(1, "rgba(0,0,0,0.8)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function drawMessage() {
        ctx.save();
        ctx.fillStyle = "#FF0000";
        ctx.shadowColor = "#660000";
        ctx.shadowBlur = 40;
        ctx.font = "bold 64px 'Creepster', cursive";
        ctx.textAlign = "center";
        ctx.fillText("🎃 Beware... Halloween Awaits! 👻", canvas.width / 2, canvas.height * 0.2);
        ctx.restore();
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawFog();
        drawMessage();

        pumpkins.forEach(p => {
          p.update();
          p.draw();
        });

        bats.forEach(b => {
          b.update();
          b.draw();
        });

        sparkles.forEach(s => {
          s.update();
          s.draw();
        });

        animationId = requestAnimationFrame(animate);
      }

      for (let i = 0; i < 5; i++) {
        pumpkins.push(new Pumpkin(
          canvas.width / 2 - 100 + i * 70,
          canvas.height - 120 + Math.random() * 20,
          40 + Math.random() * 20
        ));
      }

      for (let i = 0; i < 12; i++) bats.push(new Bat());
      for (let i = 0; i < 60; i++) sparkles.push(new Sparkle());

      animate();
    }

    // Call the function
    initHalloweenCanvas();
  </script>
</body>
</html>
