<style>.user-icon {

body {
  margin: 0;
  background: linear-gradient(-45deg, #f0f4f8, #ffe8e0, #fff0ea, #f0f4f8),
    url('img/download2.jfif');
  background-size: 400% 400%;
  animation: gradientBG 10s ease infinite;
  font-family: 'Roboto', sans-serif;
  color: #2c3e50;
}

@keyframes gradientBG {
  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}

.review-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 40px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
  margin: 40px;
  max-width: 1200px;
  margin-left: auto;
  margin-right: auto;
}

.comments-section {
  flex: 1;
  width: 100%;
}

.tabs {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.tab {
  padding: 8px 16px;
  border: 2px solid #fe5d37;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
  color: #fe5d37;
  background-color: white;
  transition: all 0.3s ease;
  white-space: nowrap;
}

.tab.active {
  background-color: #fe5d37;
  color: rgb(255, 255, 255);
}
.cards {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.card {
  width: calc((100% / 3) - 13.333px); /* 3 cards per row with gap */
  background-color: white;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  box-sizing: border-box;
  margin-bottom: 20px;
  cursor: pointer;
}

@media (max-width: 1024px) {
  .card {
    width: calc((100% / 2) - 10px); /* 2 cards per row on tablets */
  }
}

@media (max-width: 768px) {
  .card {
    width: 100%; /* 1 card per row on mobile */
    margin-bottom: 20px;
  }
}


/* Background image behind content using CSS variable */
.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: var(--bg-img);
  background-size: cover;
  background-position: center;
  opacity: 0;
  /* Hidden by default */
  transition: opacity 0.3s ease;
  z-index: 0;
  border-radius: 16px;
}

/* Show background on hover */
.card:hover::before {
  opacity: 0.4;
  /* Show on hover */
}

.card > * {
  position: relative;
  z-index: 1;
}

.user {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
  color: #000;
  /* fixed color */
}

.user img {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  margin-right: 10px;
}

.username {
  font-weight: bold;
}

.role-time {
  font-size: 12px;
  color: #000000;
}

.comment {
  margin: 10px 0;
}

.toggle {
  position: absolute;
  top: 20px;
  right: 40px;
  font-size: 14px;
  color: #2c3e50;
  user-select: none;
}

.toggle input[type='checkbox'] {
  display: none;
}

.toggle-label {
  background: #ffcab8;
  border-radius: 20px;
  display: inline-block;
  width: 40px;
  height: 20px;
  position: relative;
  vertical-align: middle;
  margin-left: 8px;
  cursor: pointer;
}

.toggle-label::before {
  content: '';
  position: absolute;
  width: 14px;
  height: 14px;
  background: #fe5d37;
  border-radius: 50%;
  top: 3px;
  left: 3px;
  transition: 0.3s;
}

input[type='checkbox']:checked + .toggle-label::before {
  transform: translateX(20px);
}

/* Responsive styles */
@media screen and (max-width: 1024px) {
  .card {
    width: calc(50% - 20px); /* Two cards per row on tablets */
  }

  .review-container {

@media screen and (max-width: 768px) {
  /* Adjust user icon sizes and padding for smaller screens */
  .user-icon {
    font-size: 16px;
    padding: 8px;
    width: 32px;
    height: 32px;
    line-height: 32px;
    margin: 0 6px;

    gap: 10px;

  .tab {
    width: 100%;
    text-align: center;
    padding: 10px 0;
    white-space: normal;
  }

  /* Cards should take full width on small screens */
  .card {
    width: 100%;
    margin: 10px 0;
  }

  /* Adjust the font size for the body */
  body {
    font-size: 14px;
  }

  /* Adjust review container padding for mobile */
  .review-container {
    padding: 20px;
    margin: 20px 10px;
  }

  /* Make the background gradient more suitable for mobile */
  body {
    background-size: 200% 200%;
    animation: gradientBG 15s ease infinite;
  }

  /* Adjust the toggle switch for better accessibility on mobile */
  .toggle-label {
    width: 30px;
    height: 16px;
  }

  .toggle-label::before {
    width: 12px;
    height: 12px;
  }
}

@media screen and (max-width: 480px) {

  // Render comments to container
  function renderComments(list) {
    const container = document.getElementById('commentsContainer');
    container.innerHTML = ''; // Clear existing comments

    if (list.length === 0) {
      container.innerHTML = '<p>No reviews to show.</p>';
      return;
    }

    list.forEach(({ iconClass, colorClass, username, time, comment, videoUrl }) => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="user">
          <i class="${iconClass} user-icon ${colorClass}"></i>
          <div>
            <div class="username">${username}</div>
            <div class="role-time">${time}</div>
          </div>
        </div>
        <div class="comment">${comment}</div>
        <h4>⭐⭐⭐⭐⭐</h4>

        
        ${videoUrl ? `<div class="video-container" style="margin-top:10px;">
          <iframe width="auto" height="200px" src="${videoUrl}" frameborder="0" allowfullscreen></iframe>
        </div>
        ` : ''}
      `;
      container.appendChild(card);
    });
  }

  // Sort newest non-video comments first
  function sortNewestNonVideos() {
    return comments
      .filter(c => !c.videoUrl)   // exclude videos
      .slice()
      .sort((a, b) => b.timestamp - a.timestamp);
  }

  // Sort oldest non-video comments first
  function sortOldestNonVideos() {
    return comments
      .filter(c => !c.videoUrl)   // exclude videos
      .slice()
      .sort((a, b) => a.timestamp - b.timestamp);
  }

  // Filter only video comments
  function filterVideos() {
    return comments.filter(c => c.videoUrl);
  }

  // Tabs
  const newestTab = document.getElementById('newestTab');
  const oldestTab = document.getElementById('oldestTab');
  const videosTab = document.getElementById('videosTab');

  function setActiveTab(tab) {
    [newestTab, oldestTab, videosTab].forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  }

  newestTab.addEventListener('click', () => {
    setActiveTab(newestTab);
    renderComments(sortNewestNonVideos());
  });

  oldestTab.addEventListener('click', () => {
    setActiveTab(oldestTab);
    renderComments(sortOldestNonVideos());
  });

  videosTab.addEventListener('click', () => {
    setActiveTab(videosTab);
    renderComments(filterVideos());
  });

  // Toggle show/hide comments container
  const toggleCheckbox = document.getElementById('comment-toggle');
  toggleCheckbox.addEventListener('change', () => {

  });
