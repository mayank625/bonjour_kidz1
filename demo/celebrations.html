    /* Reset and base */
    * {

    h1 {

    .celebrations-container {
      max-width: 1525px;
      margin: 0 auto 60px;
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      padding: 0 20px 40px;

    .festival-card {
      width: 350px;
      background: linear-gradient(145deg, #ffffff, #ffffff);
      border-radius: 26px;
      box-shadow:
        0 8px 12px rgba(255, 255, 255, 0.859);
      /*  inset -5px -5px 10px #fff3d6,
            inset 5px 5px 17px #f2d492;  */
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.3s ease;
      position: relative;

    }

    .festival-card::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 40%;
      top: 0;
      left: 0;
      background: linear-gradient(45deg, #ff6f61);
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      filter: blur(15px);
      opacity: 0.4;
      z-index: 0;
      transition: opacity 0.35s ease;
    }

    .festival-card:hover {
      transform: translateY(-12px);
      box-shadow:
        0 12px 25px rgb(255, 111, 97);
      /*inset -5px -5px 20px #ff6f61,
            inset 5px 5px 22px #ff6f61;
     */
    }

    .festival-card:hover::before {
      opacity: 0.7;
    }

    .festival-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      filter: drop-shadow(0 8px 8px rgb(255 168 0 / 0.35));
      border-bottom: 4px solid #ff6f61;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      z-index: 1;
      position: relative;
      transition: transform 0.5s ease;
    }

    .festival-card:hover img {
      transform: scale(1.03) rotate(2deg);
    }

    .festival-card h3 {
      margin: 16px 0 8px;
      font-size: 2rem;
      color: #ff6f61;
      text-shadow: 1px 1px 2px #ff6f61;
      z-index: 1;
      position: relative;
    }

    .festival-card p {
      margin: 0 20px 24px;
      font-size: 1.1rem;
      line-height: 1.4;
      font-weight: 500;
      color: #6b3e00;
      text-shadow: 0 0 1px #ff6f61;
      z-index: 1;
      position: relative;
    }

    /* Modal */

    .festival-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      background: rgba(10, 10, 10, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      animation: fadeInScale 0.5s ease forwards;
      backdrop-filter: blur(10px);
      padding: 20px;
    }
@media screen and (max-width: 768px) {
      .festival-modal {
        padding: 10px;
        }
    }

  

    .festival-content {

const container = document.querySelector('.celebrations-container');
const searchInput = document.getElementById('searchInput');

// Create no content message element and append to container (hidden initially)
const noContentMessage = document.createElement('div');
noContentMessage.className = 'no-content-message';
noContentMessage.style.display = 'none'; // hide initially
noContentMessage.innerHTML = '<p>😕 Oops! No celebrations found. Try searching again!</p>';
container.appendChild(noContentMessage);

// Function to show modal
function openModal(cardKey) {
  const modal = document.getElementById(`${cardKey}Modal`);
  if (modal) {
    const modalInstance = new bootstrap.Modal(modal);
    modalInstance.show();
  }
}

// Function to render cards and bind modal event
function renderCards(filteredCards) {
  container.innerHTML = ''; // Clear content first

  if (filteredCards.length === 0) {
    // Show no content message with animation
    container.appendChild(noContentMessage);
    noContentMessage.style.display = 'block';
    noContentMessage.classList.remove('show'); // reset animation
    void noContentMessage.offsetWidth; // trigger reflow to restart animation
    noContentMessage.classList.add('show');
    return;
  }

  // Hide no content message when there are cards to show
  noContentMessage.style.display = 'none';
  noContentMessage.classList.remove('show');

  filteredCards.forEach(card => {
    const cardDiv = document.createElement('div');
    cardDiv.className = 'festival-card';
    cardDiv.setAttribute('data-festival', card.key);
    cardDiv.setAttribute('tabindex', '0');
    cardDiv.setAttribute('aria-label', card.ariaLabel);

    cardDiv.innerHTML = `
      <img src="${card.cardImage}" alt="${card.title}">
      <h3><center>${card.title}</center></h3>
      <p>${card.desc}</p>
    `;

    // Attach click to open corresponding modal
    cardDiv.addEventListener('click', () => {
      openModal(card.key);
    });

    container.appendChild(cardDiv);
  });
}

// Initial card render
renderCards(cards);

// Filter logic
searchInput.addEventListener('input', () => {
  const searchTerm = searchInput.value.toLowerCase();
  const filteredCards = cards.filter(card =>
    card.title.toLowerCase().includes(searchTerm)
  );
  renderCards(filteredCards);
});

              const filterItems = document.querySelectorAll('.filter-item');
              const items = Array.from(filterItems);

              // Sort items so matching ones come first
              const sortedItems = items.sort((a, b) => {
                const aMatch = a.getAttribute('data-type') === filter;
                const bMatch = b.getAttribute('data-type') === filter;

                if (filter === 'all') return 0;
                return aMatch === bMatch ? 0 : aMatch ? -1 : 1;
              });

              // Append sorted items back to container
              const mediaContainer = document.getElementById('mediaContainer');
              sortedItems.forEach(item => mediaContainer.appendChild(item));

              // Toggle visibility
              filterItems.forEach(item => {
                const type = item.getAttribute('data-type');
                if (filter === 'all' || type === filter) {
                  item.classList.remove('d-none');
                } else {
                  item.classList.add('d-none');
                }
              });
            });

      // Animate Holi colors as floating vibrant balloons that softly pop into splashes
      function holiColorsAnimation() {
        const balloons = [];
        const colors = [
          '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3',
          '#03a9f4', '#00bcd4', '#009688', '#4caf50', '#8bc34a',
          '#cddc39', '#ffeb3b', '#ffc107', '#ff9800', '#ff5722'
        ];

        class Balloon {
          constructor() {
            this.radius = Math.random() * 18 + 20;
            this.x = Math.random() * canvas.width;
            this.y = canvas.height + this.radius + Math.random() * 100;
            this.speedY = Math.random() * 1.4 + 0.5;
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.alpha = 1;
            this.popped = false;
            this.popSize = 0;
            this.popX = 0;
            this.popY = 0;
          }

          update() {
            if (!this.popped) {
              this.y -= this.speedY;
              // Slight horizontal oscillation
              this.x += Math.sin(this.y / 10) * 0.7;
              if (this.y + this.radius < canvas.height / 3) {
                this.pop();
              }
            } else {
              this.popSize += 1.8;
              this.alpha -= 0.03;
              if (this.alpha < 0) this.alpha = 0;
            }
          }

          pop() {
            if (!this.popped) {
              this.popped = true;
              this.popX = this.x;
              this.popY = this.y;
            }
          }

          draw() {
            if (!this.popped) {
              // Balloon body (circle)
              ctx.save();
              ctx.globalAlpha = this.alpha;
              ctx.fillStyle = this.color;
              ctx.beginPath();
              ctx.ellipse(this.x, this.y, this.radius * 0.7, this.radius, 0, 0, Math.PI * 2);
              ctx.fill();

              // Highlight
              ctx.beginPath();
              ctx.ellipse(this.x - this.radius * 0.3, this.y - this.radius * 0.4, this.radius * 0.15, this.radius * 0.3, 0, 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
              ctx.fill();
              ctx.restore();

              // String
              ctx.save();
              ctx.strokeStyle = 'rgba(0,0,0,0.1)';
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.moveTo(this.x, this.y + this.radius);
              ctx.quadraticCurveTo(this.x + 5, this.y + this.radius + 15, this.x, this.y + this.radius + 30);
              ctx.stroke();
              ctx.restore();

            } else {
              // Draw pop splash shape growing and fading
              ctx.save();
              ctx.globalAlpha = this.alpha * 0.7;
              const size = this.popSize;
              const cx = this.popX;
              const cy = this.popY;

              // Draw splashes as colorful blobs: circles and ellipses arranged randomly around pop center
              for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 / 6) * i + (this.popSize / 10);
                const dist = size * 0.6 + Math.sin(this.popSize / 4 + i) * 10;
                const x = cx + Math.cos(angle) * dist;
                const y = cy + Math.sin(angle) * dist;
                const radius = size / 3 * (Math.sin(i * 3 + size / 5) * 0.3 + 0.7);
                ctx.beginPath();
                ctx.ellipse(x, y, radius * 1.3, radius * 0.7, angle / 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
              }
              // Center burst
              ctx.beginPath();
              ctx.ellipse(cx, cy, size * 0.9, size * 0.6, 0, 0, Math.PI * 2);
              ctx.fillStyle = this.color;
              ctx.fill();
              ctx.restore();
            }
          }
          isGone() {
            return this.popped && this.alpha <= 0;
          }
        }

        for (let i = 0; i < 40; i++) {
          balloons.push(new Balloon());
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          balloons.forEach((b, i) => {
            b.update();
            b.draw();
            if (b.isGone()) {
              balloons[i] = new Balloon();
            }
          });
          animationId = requestAnimationFrame(animate);
        }
        animate();
      }

      // Snowfall for Christmas — enhanced with twinkle shimmer
      function snowFallAnimation() {
        let flakes = [];
        const maxFlakes = 120;

        class Flake {
          constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.radius = Math.random() * 4 + 1;
            this.speed = Math.random() * 1.5 + 0.2;
            this.angle = Math.random() * 2 * Math.PI;
            this.tilt = Math.random() * 10 - 5;
            this.tiltAngleIncrement = 0.05 + Math.random() / 10;
          }
          update() {
            this.y += this.speed;
            this.angle += this.tiltAngleIncrement;
            this.tilt = Math.sin(this.angle) * 15;

            if (this.y > canvas.height + this.radius) {
              this.x = Math.random() * canvas.width;
              this.y = -this.radius;
              this.radius = Math.random() * 4 + 1;
              this.speed = Math.random() * 1.5 + 0.2;
            }
          }
          draw() {
            ctx.save();
            ctx.fillStyle = `rgba(255, 255, 255, 0.8)`;
            ctx.beginPath();
            ctx.ellipse(this.x + this.tilt, this.y, this.radius * 0.6, this.radius * 1.2, 0, 0, Math.PI * 2);
            ctx.fill();
            // twinkle highlight
            if (Math.random() > 0.94) {
              ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
              ctx.beginPath();
              ctx.arc(this.x + this.tilt, this.y, this.radius * 1.5, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }
        }

        for (let i = 0; i < maxFlakes; i++) {
          flakes.push(new Flake());
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          flakes.forEach(flake => {
            flake.update();
            flake.draw();
          });
          animationId = requestAnimationFrame(animate);
        }
        animate();
      }

      // diwali  Day animation with fireworks
       function diwaliLightsAnimation() {
  cancelAnimationFrame(animationId);

  const fireworks = [];
  const particles = [];
  const canvasWidth = canvas.width;
  const canvasHeight = canvas.height;

  class Firework {
    constructor() {
      this.x = Math.random() * canvasWidth;
      this.y = canvasHeight;
      this.targetY = Math.random() * canvasHeight * 0.5 + canvasHeight * 0.1;
      this.speedY = 3 + Math.random() * 2;
      this.exploded = false;
      this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
      this.size = 3;
    }

    update() {
      if (!this.exploded) {
        this.y -= this.speedY;
        if (this.y <= this.targetY) {
          this.exploded = true;
          this.explode();
        }
      }
    }

    explode() {
      const count = 50 + Math.floor(Math.random() * 50);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(this.x, this.y, this.color));
      }
    }

    draw() {
      if (!this.exploded) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      this.speedX = (Math.random() - 0.5) * 6;
      this.speedY = (Math.random() - 0.5) * 6;
      this.alpha = 1;
      this.gravity = 0.05;
      this.size = 2 + Math.random() * 2;
    }

    update() {
      this.speedY += this.gravity;
      this.x += this.speedX;
      this.y += this.speedY;
      this.alpha -= 0.02;
    }

    draw() {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.restore();
    }
  }

  // Optional: draw twinkling stars
  function drawStars() {
    const starCount = 100;
    ctx.fillStyle = 'white';
    for (let i = 0; i < starCount; i++) {
      const x = Math.random() * canvasWidth;
      const y = Math.random() * canvasHeight;
      const radius = Math.random() * 1.2;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function animate() {
    // Clear with a slight opacity for trailing effect
    ctx.fillStyle = 'rgba(0, 0, 20, 0.2)';
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

    // Optional: Uncomment to draw stars every frame (or move to init for performance)
    // drawStars();

    if (Math.random() < 0.05) {
      fireworks.push(new Firework());
    }

    fireworks.forEach((firework, idx) => {
      firework.update();
      firework.draw();
      if (firework.exploded) fireworks.splice(idx, 1);
    });

    particles.forEach((particle, idx) => {
      particle.update();
      particle.draw();
      if (particle.alpha <= 0) particles.splice(idx, 1);
    });

    animationId = requestAnimationFrame(animate);
  }

  animate();
}

      // Mother's Day animation with hearts and roses
      function mothersDayAnimation() {
        const hearts = [];
        const colors = ['#FF0000', '#FF4C4C', '#FF6666', '#FF1A1A', '#FF3399', '#FF66B2', '#FF1A75']; // Various shades of red and pink

        class Heart {
          constructor() {
            this.x = Math.random() * canvas.width;
            this.y = -20; // Start above the canvas
            this.size = Math.random() * 20 + 10; // Size between 10 and 30
            this.speedY = Math.random() * 2 + 1; // Falling speed between 1 and 3
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.opacity = Math.random() * 0.5 + 0.5; // Opacity between 0.5 and 1
            this.tilt = Math.random() * 0.4 - 0.2; // Slight horizontal tilt for sway effect
          }

          update() {
            this.y += this.speedY;
            this.x += this.tilt; // Horizontal sway
            if (this.y > canvas.height + this.size) {
              this.y = -this.size;
              this.x = Math.random() * canvas.width;
              this.size = Math.random() * 20 + 10;
              this.speedY = Math.random() * 2 + 1;
              this.color = colors[Math.floor(Math.random() * colors.length)];
              this.opacity = Math.random() * 0.5 + 0.5;
              this.tilt = Math.random() * 0.4 - 0.2;
            }
          }

          draw() {
            ctx.save();
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.opacity;
            const x = this.x;
            const y = this.y;
            const size = this.size;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.bezierCurveTo(x, y - size / 2, x - size, y - size / 2, x - size, y + size / 5);
            ctx.bezierCurveTo(x - size, y + size, x, y + size * 1.2, x, y + size * 1.6);
            ctx.bezierCurveTo(x, y + size * 1.2, x + size, y + size, x + size, y + size / 5);
            ctx.bezierCurveTo(x + size, y - size / 2, x, y - size / 2, x, y);
            ctx.closePath();

            ctx.fill();
            ctx.restore();
          }
        }

        for (let i = 0; i < 40; i++) {
          hearts.push(new Heart());
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          hearts.forEach(heart => {
            heart.update();
            heart.draw();
          });
          animationId = requestAnimationFrame(animate);
        }
        animate();
      }

      //independence Day animation with fireworks and particles
      function independenceDayAnimation() {
        cancelAnimationFrame(animationId);

        const fireworks = [];
        const particles = [];
        const canvasWidth = canvas.width;
        const canvasHeight = canvas.height;

        const flagColors = ['#FF9933', '#FFFFFF', '#138808']; // Saffron, White, Green
        let colorIndex = 0;

        class Firework {
          constructor() {
            this.x = Math.random() * canvasWidth;
            this.y = canvasHeight;
            this.targetY = Math.random() * canvasHeight * 0.5 + canvasHeight * 0.1;
            this.speedY = 3 + Math.random() * 2;
            this.exploded = false;
            // Cycle colors through Indian flag colors
            this.color = flagColors[colorIndex % flagColors.length];
            colorIndex++;
            this.size = 3;
          }

          update() {
            if (!this.exploded) {
              this.y -= this.speedY;
              if (this.y <= this.targetY) {
                this.exploded = true;
                this.explode();
              }
            }
          }

          explode() {
            const count = 50 + Math.floor(Math.random() * 50);
            for (let i = 0; i < count; i++) {
              particles.push(new Particle(this.x, this.y, this.color));
            }
          }

          draw() {
            if (!this.exploded) {
              ctx.beginPath();
              ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
              ctx.fillStyle = this.color;
              ctx.fill();
            }
          }
        }

        class Particle {
          constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.speedX = (Math.random() - 0.5) * 6;
            this.speedY = (Math.random() - 0.5) * 6;
            this.alpha = 1;
            this.gravity = 0.05;
            this.size = 2 + Math.random() * 2;
          }

          update() {
            this.speedY += this.gravity;
            this.x += this.speedX;
            this.y += this.speedY;
            this.alpha -= 0.02;
          }

          draw() {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.restore();
          }
        }

        function animate() {
          // Clear with a slight opacity for trailing effect
          ctx.fillStyle = 'rgba(0, 0, 30, 0.2)';
          ctx.fillRect(0, 0, canvasWidth, canvasHeight);

          if (Math.random() < 0.06) {
            fireworks.push(new Firework());
          }

          fireworks.forEach((firework, idx) => {
            firework.update();
            firework.draw();
            if (firework.exploded) fireworks.splice(idx, 1);
          });

          particles.forEach((particle, idx) => {
            particle.update();
            particle.draw();
            if (particle.alpha <= 0) particles.splice(idx, 1);
          });

          animationId = requestAnimationFrame(animate);
        }

        animate();
      }

      // Teacher's Day animation with books and pens
      function teachersDayAnimation() {
  cancelAnimationFrame(animationId);

  const books = [];
  const sparkles = [];
  const floatingObjects = [];
  const canvasWidth = canvas.width;
  const canvasHeight = canvas.height;

  // Book class with open book & flipping page effect
  class Book {
    constructor(x, y, width, height, color, index) {
      this.x = x;
      this.y = y;
      this.width = width;
      this.height = height;
      this.color = color;
      this.speedY = 0.5 + Math.random() * 0.3; // slower, steadier fall
      this.settled = false;
      this.index = index;
      this.pageFlipAngle = 0;
      this.pageFlipSpeed = 0.02 + Math.random() * 0.02;
      this.pageFlipDirection = 1;
    }
    update() {
      if (!this.settled) {
        this.y += this.speedY;
        if (this.y >= canvasHeight - (books.length * this.height) - 80) {
          this.y = canvasHeight - (books.length * this.height) - 80;
          this.settled = true;
          this.speedY = 0;
        }
      } else {
        // Animate page flipping back and forth
        this.pageFlipAngle += this.pageFlipSpeed * this.pageFlipDirection;
        if (this.pageFlipAngle > 0.3 || this.pageFlipAngle < 0) {
          this.pageFlipDirection *= -1;
        }
      }
    }
    draw() {
      // Book base
      ctx.fillStyle = this.color;
      ctx.shadowColor = "rgba(0,0,0,0.3)";
      ctx.shadowBlur = 10;
      ctx.fillRect(this.x, this.y, this.width, this.height);

      // Book spine
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(this.x + this.width - 10, this.y, 10, this.height);

      ctx.shadowBlur = 0;

      // Draw open book pages (two angled page shapes)
      ctx.save();
      ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
      ctx.fillStyle = '#fefefe';
      ctx.strokeStyle = '#ccc';
      ctx.lineWidth = 1;

      // Left page flipping
      ctx.save();
      ctx.rotate(this.pageFlipAngle);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-this.width / 2, -this.height / 2);
      ctx.lineTo(-this.width / 2, this.height / 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Right page flipping (opposite)
      ctx.save();
      ctx.rotate(-this.pageFlipAngle);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(this.width / 2, -this.height / 2);
      ctx.lineTo(this.width / 2, this.height / 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }
  }

  // Apple class same as before
  class Apple {
    constructor() {
      this.x = canvasWidth / 2;
      this.y = canvasHeight - books[0].height * books.length - 130;
      this.size = 30;
      this.alpha = 0;
      this.glowDirection = 1;
    }
    update() {
      if (this.alpha < 1) this.alpha += 0.02;
      if (this.alpha >= 1) {
        this.alpha += 0.01 * this.glowDirection;
        if (this.alpha >= 1.2 || this.alpha <= 0.8) this.glowDirection *= -1;
      }
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      // apple body
      ctx.beginPath();
      ctx.ellipse(this.x, this.y, this.size, this.size * 1.2, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'red';
      ctx.fill();
      // leaf
      ctx.beginPath();
      ctx.ellipse(this.x + 12, this.y - 30, 12, 8, Math.PI / 4, 0, Math.PI * 2);
      ctx.fillStyle = 'green';
      ctx.fill();
      // stem
      ctx.beginPath();
      ctx.strokeStyle = 'brown';
      ctx.lineWidth = 3;
      ctx.moveTo(this.x, this.y - this.size * 1.1);
      ctx.lineTo(this.x, this.y - this.size * 1.6);
      ctx.stroke();
      ctx.restore();
    }
  }

  // Sparkle class same as before
  class Sparkle {
    constructor() {
      this.x = Math.random() * canvasWidth;
      this.y = Math.random() * canvasHeight * 0.7;
      this.size = Math.random() * 3 + 1;
      this.alpha = Math.random();
      this.speedY = 0.5 + Math.random();
      this.speedX = (Math.random() - 0.5) * 0.5;
    }
    update() {
      this.y -= this.speedY;
      this.x += this.speedX;
      this.alpha -= 0.01;
      if (this.alpha <= 0) {
        this.x = Math.random() * canvasWidth;
        this.y = canvasHeight;
        this.alpha = 1;
      }
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = 'yellow';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // Floating teaching tools class (like before)
  class FloatingTool {
    constructor(x, y, type) {
      this.x = x;
      this.y = y;
      this.type = type;
      this.size = 30 + Math.random() * 20;
      this.speedY = 0.5 + Math.random() * 0.5;
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.angle = 0;
      this.angleSpeed = (Math.random() - 0.5) * 0.02;
    }

    update() {
      this.x += this.speedX;
      this.y -= this.speedY;
      this.angle += this.angleSpeed;

      if (this.x < -50) this.x = canvasWidth + 50;
      if (this.x > canvasWidth + 50) this.x = -50;
      if (this.y < -50) this.y = canvasHeight + 50;
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      switch (this.type) {
        case 'pen':
          drawPen(ctx, this.size);
          break;
        case 'paper':
          drawPaper(ctx, this.size);
          break;
        case 'chalk':
          drawChalk(ctx, this.size);
          break;
        case 'marker':
          drawMarker(ctx, this.size);
          break;
        case 'book':
          drawSmallBook(ctx, this.size);
          break;
      }

      ctx.restore();
    }
  }

  // Drawing functions for tools (same as before)
  function drawPen(ctx, size) {
    ctx.fillStyle = '#222';
    ctx.fillRect(-size / 10, -size / 2, size / 5, size);
    ctx.fillStyle = 'silver';
    ctx.beginPath();
    ctx.moveTo(-size / 10, size / 2);
    ctx.lineTo(size / 10, size / 2);
    ctx.lineTo(0, size / 2 + size / 4);
    ctx.closePath();
    ctx.fill();
  }
  function drawPaper(ctx, size) {
    ctx.fillStyle = 'white';
    ctx.fillRect(-size / 2, -size / 2, size, size * 1.3);
    ctx.strokeStyle = '#ccc';
    for (let i = -size / 2 + 5; i < size / 2; i += 10) {
      ctx.beginPath();
      ctx.moveTo(-size / 2 + 5, i);
      ctx.lineTo(size / 2 - 5, i);
      ctx.stroke();
    }
  }
  function drawChalk(ctx, size) {
    ctx.fillStyle = '#eee';
    ctx.fillRect(-size / 6, -size / 2, size / 3, size);
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.strokeRect(-size / 6, -size / 2, size / 3, size);
  }
  function drawMarker(ctx, size) {
    ctx.fillStyle = '#f90';
    ctx.fillRect(-size / 6, -size / 2, size / 3, size);
    ctx.fillStyle = 'black';
    ctx.fillRect(-size / 6, size / 4, size / 3, size / 6);
  }
  function drawSmallBook(ctx, size) {
    ctx.fillStyle = '#6a5acd';
    ctx.fillRect(-size / 2, -size / 3, size, size / 2);
    ctx.fillStyle = '#483d8b';
    ctx.fillRect(size / 4, -size / 3, size / 8, size / 2);
  }

  // Chalkboard background
  function drawBackground() {
    ctx.fillStyle = '#2f4f4f'; // dark chalkboard green
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    ctx.strokeStyle = '#4caf50';
    ctx.lineWidth = 5;
    ctx.strokeRect(10, 10, canvasWidth - 20, canvasHeight - 20);
  }

  // Teacher's Day message with handwriting style
  let messageAlpha = 0;
  function drawMessage() {
    ctx.save();
    ctx.globalAlpha = messageAlpha;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px "Comic Sans MS", cursive, sans-serif';
    ctx.textAlign = 'center';

    ctx.shadowBlur = 10;
    ctx.fillText("Happy Teacher's Day!", canvasWidth / 2, canvasHeight * 0.15);
    ctx.font = '24px "Comic Sans MS", cursive, sans-serif';
    ctx.fillText(" ", canvasWidth / 2, canvasHeight * 0.22);

    if (messageAlpha < 1) messageAlpha += 0.01;
  }

  // Create books stack (6 books)
  for (let i = 0; i < 6; i++) {
    const width = 80;
    const height = 25;
    const x = canvasWidth / 7 * (i + 1) - width / 2;

    books.push(new Book(x, y, width, height, colors[i % colors.length], i));
  }

  const apple = new Apple();

  for (let i = 0; i < 30; i++) {

  }

  // Floating tools
  const toolTypes = ['pen', 'paper', 'chalk', 'marker', 'book'];
  for (let i = 0; i < 12; i++) {
    floatingObjects.push(new FloatingTool(
      Math.random() * canvasWidth,
      Math.random() * canvasHeight * 0.7 + canvasHeight * 0.2,
      toolTypes[i % toolTypes.length]
    ));
  }

  function animate() {
    drawBackground();

    books.forEach(book => {
      book.update();
      book.draw();
    });

    apple.update();
    apple.draw();

    sparkles.forEach(sparkle => {
      sparkle.update();
      sparkle.draw();
    });

    floatingObjects.forEach(obj => {
      obj.update();

    });

//halloween animtion 
function startHalloweenAnimation(canvas) {
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const pumpkins = [];
  const bats = [];
  const sparkles = [];

  class Pumpkin {
    constructor(x, y, size) {
      this.x = x;
      this.y = y;
      this.size = size;
      this.alpha = 0;
    }

    update() {
      if (this.alpha < 1) this.alpha += 0.01;
    }

    draw() {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.beginPath();
      ctx.fillStyle = "orange";
      ctx.ellipse(this.x, this.y, this.size, this.size * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = "black";
      ctx.beginPath();
      ctx.moveTo(this.x - this.size / 3, this.y - this.size / 4);
      ctx.lineTo(this.x - this.size / 4, this.y - this.size / 2);
      ctx.lineTo(this.x - this.size / 6, this.y - this.size / 4);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(this.x + this.size / 3, this.y - this.size / 4);
      ctx.lineTo(this.x + this.size / 4, this.y - this.size / 2);
      ctx.lineTo(this.x + this.size / 6, this.y - this.size / 4);
      ctx.closePath();
      ctx.fill();

      // Mouth
      ctx.beginPath();
      ctx.arc(this.x, this.y + this.size / 4, this.size / 3, 0, Math.PI, false);
      ctx.fill();

      ctx.restore();
    }
  }

  class Bat {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height * 0.5;
      this.size = 20 + Math.random() * 20;
      this.speedX = -1.5 + Math.random() * 3;
      this.speedY = -0.5 + Math.random();
      this.angle = 0;
    }

    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      this.angle += 0.1;

      if (this.x < -50 || this.x > canvas.width + 50 || this.y < -50 || this.y > canvas.height + 50) {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height * 0.5 + Math.random() * canvas.height * 0.5;
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(Math.sin(this.angle) * 0.5);
      ctx.fillStyle = "black";
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-this.size, -this.size / 2);
      ctx.lineTo(-this.size / 2, 0);
      ctx.lineTo(-this.size, this.size / 2);
      ctx.lineTo(0, 0);
      ctx.lineTo(this.size, -this.size / 2);
      ctx.lineTo(this.size / 2, 0);
      ctx.lineTo(this.size, this.size / 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  class Sparkle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + 1;
      this.alpha = Math.random();
      this.speedY = 0.5 + Math.random();
    }

    update() {
      this.y -= this.speedY;
      this.alpha -= 0.01;
      if (this.alpha <= 0) {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height;
        this.alpha = 1;
      }
    }

    draw() {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawMessage() {
    ctx.save();
    ctx.fillStyle = "#FF8C00";
    ctx.shadowColor = "#FF4500";
    ctx.shadowBlur = 20;
    ctx.font = "bold 60px 'Creepster', cursive";
    ctx.textAlign = "center";
    ctx.fillText("Happy Halloween!", canvas.width / 2, canvas.height * 0.2);
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawMessage();

    pumpkins.forEach(p => { p.update(); p.draw(); });
    bats.forEach(b => { b.update(); b.draw(); });
    sparkles.forEach(s => { s.update(); s.draw(); });

    requestAnimationFrame(animate);
  }

  // Initialize elements
  for (let i = 0; i < 4; i++) {
    pumpkins.push(new Pumpkin(
      canvas.width / 2 - 100 + i * 60,
      canvas.height - 100,
      40 + Math.random() * 10
    ));
  }
  for (let i = 0; i < 10; i++) bats.push(new Bat());
  for (let i = 0; i < 50; i++) sparkles.push(new Sparkle());

  // Start animation
  animate();
}

        const festival = festivalData[festivalKey];
        if (!festival) return;

        title.textContent = festival.title;
        desc.textContent = festival.desc;

        // Clear existing images and videos
        const mediaContainer = document.getElementById('mediaContainer');
        mediaContainer.innerHTML = ''; // Clear previous content

        // Add images
        festival.images.forEach(imageSrc => {
          const imageCard = document.createElement('div');
          imageCard.className = 'col-md-4 filter-item';
          imageCard.setAttribute('data-type', 'image');
          imageCard.innerHTML = `
    <div class="p-3 bg-secondary h-100 rounded shadow d-flex flex-column align-items-center text-center">
      <a data-fancybox="gallery" href="${imageSrc}">
        <img src="${imageSrc}" class="img-fluid rounded mb-3" style="height: 200px; object-fit: cover;">
      </a>
    </div>
  `;
          mediaContainer.appendChild(imageCard);
        });

        // Add videos
        festival.videos.forEach(videoSrc => {
          const videoCard = document.createElement('div');
          videoCard.className = 'col-md-4 filter-item';
          videoCard.setAttribute('data-type', 'video');
          videoCard.innerHTML = `
    <div class="p-3 bg-secondary h-100 rounded shadow d-flex flex-column align-items-center text-center">
      <a data-fancybox="gallery" href="${videoSrc}">
        <video controls style="height: 200px;" class="mb-3 w-100 rounded">
          <source src="${videoSrc}" type="video/mp4">
        </video>
      </a>
    </div>
  `;
          mediaContainer.appendChild(videoCard);
        });

        modal.classList.add('active');
        modal.style.display = 'flex';
        resizeCanvas();

        // Start animation
        runAnimation(festival.animation);

        document.body.style.overflow = 'hidden';
        closeBtn.focus();
      }

      function runAnimation(type) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        cancelAnimationFrame(animationId);

        switch (type) {
          case 'holiColors':
            holiColorsAnimation();
            break;
          case 'snowFall':
            snowFallAnimation();
            break;
          case 'diwaliLights':
            diwaliLightsAnimation();
            break;
          case 'mothersDay':
            mothersDayAnimation();
            break;
          case 'smokeBlue':
            smokeBlueAnimation();
            break;
          case 'cargillDiwas':
            cargillDiwasAnimation();
            break;
          case 'chocolateDay':
            chocolateDayAnimation();
            break;
          case 'independenceDay':
            independenceDayAnimation();
            break;
          case 'teachersDay':
            teachersDayAnimation();
            break;
          case 'startHalloween': 
            startHalloweenAnimation(canvas);
            break;
          default:
            break;
        }
      }   

      function closeFestivalModal() {
        modal.classList.remove('active');
        modal.style.display = 'none';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        cancelAnimationFrame(animationId);
        document.body.style.overflow = '';
      }

      festivalCards.forEach(card => {
        card.addEventListener('click', () => openFestivalModal(card.dataset.festival));
        card.addEventListener('keypress', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openFestivalModal(card.dataset.festival);
          }
        });
      });

      closeBtn.addEventListener('click', closeFestivalModal);

      window.addEventListener('keydown', e => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          closeFestivalModal();
        }
      });
    </script>
