    /* Reset and base */
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: url('img/bg-06.png') no-repeat center center fixed;
      background-size: cover;

      padding: 0;

    }


    h1 {
      text-align: center;
      margin: 40px 0 20px;
      font-size: 3.2rem;
      color: #472d2d;
      letter-spacing: 1.2px;
      text-shadow:
        2px 2px 0 #ff6f61,
        -1px -1px 0 #ff6f61;
    }

    .celebrations-container {
      max-width: 1525px;
      margin: 0 auto 60px;
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      padding: 0 20px 40px;
    }

    .festival-card {
      width: 350px;
      background: linear-gradient(145deg, #ffffff, #ffffff);
      border-radius: 26px;
      box-shadow:
        0 8px 12px rgba(255, 255, 255, 0.859);
      /*  inset -5px -5px 10px #fff3d6,
            inset 5px 5px 17px #f2d492;  */
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.3s ease;
      position: relative;

    }

    .festival-card::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 40%;
      top: 0;
      left: 0;
      background: linear-gradient(45deg, #ff6f61);
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      filter: blur(15px);
      opacity: 0.4;
      z-index: 0;
      transition: opacity 0.35s ease;
    }

    .festival-card:hover {
      transform: translateY(-12px);
      box-shadow:
        0 12px 25px rgb(255, 111, 97);
      /*inset -5px -5px 20px #ff6f61,
            inset 5px 5px 22px #ff6f61;
     */
    }

    .festival-card:hover::before {
      opacity: 0.7;
    }

    .festival-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      filter: drop-shadow(0 8px 8px rgb(255 168 0 / 0.35));
      border-bottom: 4px solid #ff6f61;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      z-index: 1;
      position: relative;
      transition: transform 0.5s ease;
    }

    .festival-card:hover img {
      transform: scale(1.03) rotate(2deg);
    }

    .festival-card h3 {
      margin: 16px 0 8px;
      font-size: 2rem;
      color: #ff6f61;
      text-shadow: 1px 1px 2px #ff6f61;
      z-index: 1;
      position: relative;
    }

    .festival-card p {
      margin: 0 20px 24px;
      font-size: 1.1rem;
      line-height: 1.4;
      font-weight: 500;
      color: #6b3e00;
      text-shadow: 0 0 1px #ff6f61;
      z-index: 1;
      position: relative;
    }

    /* Modal */

    .festival-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      background: rgba(10, 10, 10, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      animation: fadeInScale 0.5s ease forwards;
      backdrop-filter: blur(10px);
      padding: 20px;
    }
@media screen and (max-width: 768px) {
      .festival-modal {
        padding: 10px;
        }
    }

  

    .festival-content {
      position: relative;
      /*  background: radial-gradient(circle at top left, #a40101, #fff); */
      background-image: url('img/bg-07.png');
      background-size: cover;

      background-repeat: no-repeat;

      border-radius: 32px;

    .festival-content::-webkit-scrollbar {

      background: #fbe9b7;

const container = document.querySelector('.celebrations-container');
const searchInput = document.getElementById('searchInput');

// Create no content message element and append to container (hidden initially)
const noContentMessage = document.createElement('div');
noContentMessage.className = 'no-content-message';
noContentMessage.style.display = 'none'; // hide initially
noContentMessage.innerHTML = '<p>😕 Oops! No celebrations found. Try searching again!</p>';
container.appendChild(noContentMessage);

// Function to show modal
function openModal(cardKey) {
  const modal = document.getElementById(`${cardKey}Modal`);
  if (modal) {
    const modalInstance = new bootstrap.Modal(modal);
    modalInstance.show();
  }
}

// Function to render cards and bind modal event
function renderCards(filteredCards) {
  container.innerHTML = ''; // Clear content first

  if (filteredCards.length === 0) {
    // Show no content message with animation
    container.appendChild(noContentMessage);
    noContentMessage.style.display = 'block';
    noContentMessage.classList.remove('show'); // reset animation
    void noContentMessage.offsetWidth; // trigger reflow to restart animation
    noContentMessage.classList.add('show');
    return;
  }

  // Hide no content message when there are cards to show
  noContentMessage.style.display = 'none';
  noContentMessage.classList.remove('show');

  filteredCards.forEach(card => {
    const cardDiv = document.createElement('div');
    cardDiv.className = 'festival-card';
    cardDiv.setAttribute('data-festival', card.key);
    cardDiv.setAttribute('tabindex', '0');
    cardDiv.setAttribute('aria-label', card.ariaLabel);

    cardDiv.innerHTML = `
      <img src="${card.cardImage}" alt="${card.title}">
      <h3><center>${card.title}</center></h3>
      <p>${card.desc}</p>
    `;

    // Attach click to open corresponding modal
    cardDiv.addEventListener('click', () => {
      openModal(card.key);
    });

    container.appendChild(cardDiv);
  });
}

// Initial card render
renderCards(cards);

// Filter logic
searchInput.addEventListener('input', () => {
  const searchTerm = searchInput.value.toLowerCase();
  const filteredCards = cards.filter(card =>
    card.title.toLowerCase().includes(searchTerm)
  );
  renderCards(filteredCards);
});

              // Re-select filterItems on each click
              const filterItems = document.querySelectorAll('.filter-item');
              const items = Array.from(filterItems);

              // Sort items so matching ones come first
              const sortedItems = items.sort((a, b) => {
                const aMatch = a.getAttribute('data-type') === filter;
                const bMatch = b.getAttribute('data-type') === filter;

                if (filter === 'all') return 0;
                return aMatch === bMatch ? 0 : aMatch ? -1 : 1;
              });

              // Append sorted items back to container
              const mediaContainer = document.getElementById('mediaContainer');
              sortedItems.forEach(item => mediaContainer.appendChild(item));

              // Toggle visibility
              filterItems.forEach(item => {
                const type = item.getAttribute('data-type');
                if (filter === 'all' || type === filter) {
                  item.classList.remove('d-none');
                } else {
                  item.classList.add('d-none');
                }
              });
            });

      // Animate Holi colors as floating vibrant balloons that softly pop into splashes
      function holiColorsAnimation() {
        const balloons = [];
        const colors = [
          '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3',
          '#03a9f4', '#00bcd4', '#009688', '#4caf50', '#8bc34a',
          '#cddc39', '#ffeb3b', '#ffc107', '#ff9800', '#ff5722'
        ];

        class Balloon {
          constructor() {
            this.radius = Math.random() * 18 + 20;
            this.x = Math.random() * canvas.width;
            this.y = canvas.height + this.radius + Math.random() * 100;
            this.speedY = Math.random() * 1.4 + 0.5;
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.alpha = 1;
            this.popped = false;
            this.popSize = 0;
            this.popX = 0;
            this.popY = 0;
          }

          update() {
            if (!this.popped) {
              this.y -= this.speedY;
              // Slight horizontal oscillation
              this.x += Math.sin(this.y / 10) * 0.7;
              if (this.y + this.radius < canvas.height / 3) {
                this.pop();
              }
            } else {
              this.popSize += 1.8;
              this.alpha -= 0.03;
              if (this.alpha < 0) this.alpha = 0;
            }
          }

          pop() {
            if (!this.popped) {
              this.popped = true;
              this.popX = this.x;
              this.popY = this.y;
            }
          }

          draw() {
            if (!this.popped) {
              // Balloon body (circle)
              ctx.save();
              ctx.globalAlpha = this.alpha;
              ctx.fillStyle = this.color;
              ctx.beginPath();
              ctx.ellipse(this.x, this.y, this.radius * 0.7, this.radius, 0, 0, Math.PI * 2);
              ctx.fill();

              // Highlight
              ctx.beginPath();
              ctx.ellipse(this.x - this.radius * 0.3, this.y - this.radius * 0.4, this.radius * 0.15, this.radius * 0.3, 0, 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
              ctx.fill();
              ctx.restore();

              // String
              ctx.save();
              ctx.strokeStyle = 'rgba(0,0,0,0.1)';
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.moveTo(this.x, this.y + this.radius);
              ctx.quadraticCurveTo(this.x + 5, this.y + this.radius + 15, this.x, this.y + this.radius + 30);
              ctx.stroke();
              ctx.restore();

            } else {
              // Draw pop splash shape growing and fading
              ctx.save();
              ctx.globalAlpha = this.alpha * 0.7;
              const size = this.popSize;
              const cx = this.popX;
              const cy = this.popY;

              // Draw splashes as colorful blobs: circles and ellipses arranged randomly around pop center
              for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 / 6) * i + (this.popSize / 10);
                const dist = size * 0.6 + Math.sin(this.popSize / 4 + i) * 10;
                const x = cx + Math.cos(angle) * dist;
                const y = cy + Math.sin(angle) * dist;
                const radius = size / 3 * (Math.sin(i * 3 + size / 5) * 0.3 + 0.7);
                ctx.beginPath();
                ctx.ellipse(x, y, radius * 1.3, radius * 0.7, angle / 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
              }
              // Center burst
              ctx.beginPath();
              ctx.ellipse(cx, cy, size * 0.9, size * 0.6, 0, 0, Math.PI * 2);
              ctx.fillStyle = this.color;
              ctx.fill();
              ctx.restore();
            }
          }
          isGone() {
            return this.popped && this.alpha <= 0;
          }
        }

        for (let i = 0; i < 40; i++) {
          balloons.push(new Balloon());
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          balloons.forEach((b, i) => {
            b.update();
            b.draw();
            if (b.isGone()) {
              balloons[i] = new Balloon();
            }
          });
          animationId = requestAnimationFrame(animate);
        }
        animate();
      }

      // Snowfall for Christmas — enhanced with twinkle shimmer
      function snowFallAnimation() {
        let flakes = [];
        const maxFlakes = 120;

        class Flake {
          constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.radius = Math.random() * 4 + 1;
            this.speed = Math.random() * 1.5 + 0.2;
            this.angle = Math.random() * 2 * Math.PI;
            this.tilt = Math.random() * 10 - 5;
            this.tiltAngleIncrement = 0.05 + Math.random() / 10;
          }
          update() {
            this.y += this.speed;
            this.angle += this.tiltAngleIncrement;
            this.tilt = Math.sin(this.angle) * 15;

            if (this.y > canvas.height + this.radius) {
              this.x = Math.random() * canvas.width;
              this.y = -this.radius;
              this.radius = Math.random() * 4 + 1;
              this.speed = Math.random() * 1.5 + 0.2;
            }
          }
          draw() {
            ctx.save();
            ctx.fillStyle = `rgba(255, 255, 255, 0.8)`;
            ctx.beginPath();
            ctx.ellipse(this.x + this.tilt, this.y, this.radius * 0.6, this.radius * 1.2, 0, 0, Math.PI * 2);
            ctx.fill();
            // twinkle highlight
            if (Math.random() > 0.94) {
              ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
              ctx.beginPath();
              ctx.arc(this.x + this.tilt, this.y, this.radius * 1.5, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }
        }

        for (let i = 0; i < maxFlakes; i++) {
          flakes.push(new Flake());
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          flakes.forEach(flake => {
            flake.update();
            flake.draw();
          });
          animationId = requestAnimationFrame(animate);
        }
        animate();
      }

      // Diwali fireworks — get burst effect with color trails
      function diwaliLightsAnimation() {
        let fireworks = [];
        let particles = [];

        class Firework {
          constructor() {
            this.x = Math.random() * canvas.width;
            this.y = canvas.height;
            this.targetY = canvas.height * (0.2 + Math.random() * 0.5);
            this.speedY = 7 + Math.random() * 5;
            this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
            this.trail = [];
            this.done = false;
          }

          update() {
            this.trail.push({ x: this.x, y: this.y });
            if (this.trail.length > 10) this.trail.shift();

            this.y -= this.speedY;
            if (this.y <= this.targetY) {
              this.done = true;
              this.explode();
            }
          }

          explode() {
            const petals = 7 + Math.floor(Math.random() * 3);
            const rings = 2 + Math.floor(Math.random() * 4);
            const radiusStep = 2.5;

            for (let r = 1; r <= rings; r++) {
              for (let i = 0; i < petals; i++) {
                const angle = (Math.PI * 2 / petals) * i;
                const speed = radiusStep * r;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                // Each particle gets a different bright HSL color
                const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                particles.push(new Particle(this.x, this.y, color, vx, vy));
              }
            }
          }

          draw() {
            ctx.beginPath();
            ctx.fillStyle = this.color;
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 2;
            ctx.moveTo(this.x, this.y);
            this.trail.forEach(pos => ctx.lineTo(pos.x, pos.y));
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        class Particle {
          constructor(x, y, color, vx = (Math.random() - 0.5) * 6, vy = (Math.random() - 0.5) * 6) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.radius = 3;
            this.speedX = vx;
            this.speedY = vy;
            this.gravity = 0.05;
            this.life = 80 + Math.random() * 40;
            this.alpha = 1;
            this.decay = 0.01 + Math.random() * 0.015;
          }

          update() {
            this.speedY += this.gravity;
            this.x += this.speedX;
            this.y += this.speedY;
            this.life--;
            this.alpha -= this.decay;
            if (this.alpha < 0) this.alpha = 0;
          }

          draw() {
            ctx.beginPath();
            ctx.fillStyle = this.color.replace('hsl', 'hsla').replace(')', `,${this.alpha})`);
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 12;
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          }

          isDead() {
            return this.life <= 0 || this.alpha <= 0;
          }
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (Math.random() < 0.04) fireworks.push(new Firework());

          for (let i = fireworks.length - 1; i >= 0; i--) {
            const f = fireworks[i];
            f.update();
            f.draw();
            if (f.done) fireworks.splice(i, 1);
          }

          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.update();
            p.draw();
            if (p.isDead()) particles.splice(i, 1);
          }

          ctx.fillStyle = 'rgba(0,0,0,0.15)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          requestAnimationFrame(animate);
        }

        animate();
      }

      // Mother's Day animation with hearts and roses
      function mothersDayAnimation() {
        const hearts = [];
        const colors = ['#FF0000', '#FF4C4C', '#FF6666', '#FF1A1A', '#FF3399', '#FF66B2', '#FF1A75']; // Various shades of red and pink

        class Heart {
          constructor() {
            this.x = Math.random() * canvas.width;
            this.y = -20; // Start above the canvas
            this.size = Math.random() * 20 + 10; // Size between 10 and 30
            this.speedY = Math.random() * 2 + 1; // Falling speed between 1 and 3
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.opacity = Math.random() * 0.5 + 0.5; // Opacity between 0.5 and 1
            this.tilt = Math.random() * 0.4 - 0.2; // Slight horizontal tilt for sway effect
          }

          update() {
            this.y += this.speedY;
            this.x += this.tilt; // Horizontal sway
            if (this.y > canvas.height + this.size) {
              this.y = -this.size;
              this.x = Math.random() * canvas.width;
              this.size = Math.random() * 20 + 10;
              this.speedY = Math.random() * 2 + 1;
              this.color = colors[Math.floor(Math.random() * colors.length)];
              this.opacity = Math.random() * 0.5 + 0.5;
              this.tilt = Math.random() * 0.4 - 0.2;
            }
          }

          draw() {
            ctx.save();
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.opacity;
            const x = this.x;
            const y = this.y;
            const size = this.size;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.bezierCurveTo(x, y - size / 2, x - size, y - size / 2, x - size, y + size / 5);
            ctx.bezierCurveTo(x - size, y + size, x, y + size * 1.2, x, y + size * 1.6);
            ctx.bezierCurveTo(x, y + size * 1.2, x + size, y + size, x + size, y + size / 5);
            ctx.bezierCurveTo(x + size, y - size / 2, x, y - size / 2, x, y);
            ctx.closePath();

            ctx.fill();
            ctx.restore();
          }
        }

        for (let i = 0; i < 40; i++) {
          hearts.push(new Heart());
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          hearts.forEach(heart => {
            heart.update();
            heart.draw();
          });
          animationId = requestAnimationFrame(animate);
        }
        animate();
      }

      function chocolateRainAnimation() {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  let width = window.innerWidth;
  let height = window.innerHeight;

  canvas.width = width;
  canvas.height = height;

  window.addEventListener("resize", () => {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  });

  const emojiList = ['🍫', '🍬', '🍭' ]; // All emoji
  const drops = [];

  class Drop {
    constructor() {
      this.reset();
    }

    reset() {
      this.x = Math.random() * width;
      this.y = -Math.random() * height;
      this.size = 32 + Math.random() * 16;
      this.emoji = emojiList[Math.floor(Math.random() * emojiList.length)];
      this.speedY = 1.5 + Math.random() * 2;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.01;
      this.opacity = 1;
    }

    update() {
      this.y += this.speedY;
      this.rotation += this.rotationSpeed;

      if (this.y > height + 50) {
        this.reset();
        this.y = -50;
      }
    }

    draw() {
      ctx.save();
      ctx.globalAlpha = this.opacity;
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.font = `${this.size}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(this.emoji, 0, 0);
      ctx.restore();
    }
  }

  for (let i = 0; i < 70; i++) {
    drops.push(new Drop());
  }

  function animate() {
    ctx.clearRect(0, 0, width, height); // Clear the canvas completely (no blurry trail)

    for (const drop of drops) {
      drop.update();
      drop.draw();
    }

    requestAnimationFrame(animate);
  }

  animate();
}

 

      const festivalCards = document.querySelectorAll('.festival-card');

      function openFestivalModal(festivalKey) {
        const festival = festivalData[festivalKey];
        if (!festival) return;

        title.textContent = festival.title;
        desc.textContent = festival.desc;

        // Clear existing images and videos
        const mediaContainer = document.getElementById('mediaContainer');
        mediaContainer.innerHTML = ''; // Clear previous content

        // Add images
        festival.images.forEach(imageSrc => {
          const imageCard = document.createElement('div');
          imageCard.className = 'col-md-4 filter-item';
          imageCard.setAttribute('data-type', 'image');
          imageCard.innerHTML = `
    <div class="p-3 bg-secondary h-100 rounded shadow d-flex flex-column align-items-center text-center">
      <a data-fancybox="gallery" href="${imageSrc}">
        <img src="${imageSrc}" class="img-fluid rounded mb-3" style="height: 200px; object-fit: cover;">
      </a>
    </div>
  `;
          mediaContainer.appendChild(imageCard);
        });

        // Add videos
        festival.videos.forEach(videoSrc => {
          const videoCard = document.createElement('div');
          videoCard.className = 'col-md-4 filter-item';
          videoCard.setAttribute('data-type', 'video');
          videoCard.innerHTML = `
    <div class="p-3 bg-secondary h-100 rounded shadow d-flex flex-column align-items-center text-center">
      <a data-fancybox="gallery" href="${videoSrc}">
        <video controls style="height: 200px;" class="mb-3 w-100 rounded">
          <source src="${videoSrc}" type="video/mp4">
        </video>
      </a>
    </div>
  `;
          mediaContainer.appendChild(videoCard);
        });

        modal.classList.add('active');
        modal.style.display = 'flex';
        resizeCanvas();

        // Start animation
        runAnimation(festival.animation);

        document.body.style.overflow = 'hidden';
        closeBtn.focus();
      }

      function runAnimation(type) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        cancelAnimationFrame(animationId);

        switch (type) {
          case 'holiColors':
            holiColorsAnimation();
            break;
          case 'snowFall':
            snowFallAnimation();
            break;
          case 'diwaliLights':
            diwaliLightsAnimation();
            break;
          case 'mothersDay':
            mothersDayAnimation();
            break;
           
          default:
            break;
        }
      }

      function closeFestivalModal() {
        modal.classList.remove('active');
        modal.style.display = 'none';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        cancelAnimationFrame(animationId);
        document.body.style.overflow = '';
      }

      festivalCards.forEach(card => {
        card.addEventListener('click', () => openFestivalModal(card.dataset.festival));
        card.addEventListener('keypress', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openFestivalModal(card.dataset.festival);
          }
        });
      });

      closeBtn.addEventListener('click', closeFestivalModal);

      window.addEventListener('keydown', e => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          closeFestivalModal();
        }
      });
