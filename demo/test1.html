<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Course Reviews with Persistent Storage</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background: linear-gradient(-45deg, #f0f4f8, #ffe8e0, #fff0ea, #f0f4f8);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      font-family: 'Roboto', sans-serif;
      color: #2c3e50;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .review-card {
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 1rem;
      transition: transform 0.3s ease, border 0.3s ease;
      border: 2px solid transparent; /* Default border */
    }

    .review-card:hover {
      transform: scale(1.05);
      border: 2px solid #FE5D37; /* Border on hover */
    }

    .modal-content {
      border-radius: 16px;
    }
  </style>
</head>

<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4">Student Reviews</h2>

    <!-- Button to trigger Write Review Modal -->
    <button
      class="btn btn-primary mb-4"
      data-bs-toggle="modal"
      data-bs-target="#writeReviewModal"
    >
      Write a Review
    </button>

    <!-- Reviews container -->
    <div id="reviews-container" class="row"></div>
  </div>

  <!-- Modal for writing a review -->
  <div
    class="modal fade"
    id="writeReviewModal"
    tabindex="-1"
    aria-labelledby="writeReviewModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <form id="reviewForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="writeReviewModalLabel">Write a Review</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="reviewerName" class="form-label">Your Name</label>
            <input type="text" class="form-control" id="reviewerName" required />
          </div>
          <div class="mb-3">
            <label for="courseName" class="form-label">Course Name</label>
            <input type="text" class="form-control" id="courseName" required />
          </div>
          <div class="mb-3">
            <label for="reviewText" class="form-label">Your Review</label>
            <textarea
              class="form-control"
              id="reviewText"
              rows="3"
              required
            ></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Submit Review</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const reviewForm = document.getElementById('reviewForm');
    const reviewsContainer = document.getElementById('reviews-container');

    // Key to store reviews in localStorage
    const STORAGE_KEY = 'courseReviews';

    // Load reviews from localStorage and display
    function loadReviews() {
      const reviewsJSON = localStorage.getItem(STORAGE_KEY);
      if (reviewsJSON) {
        try {
          const reviews = JSON.parse(reviewsJSON);
          reviewsContainer.innerHTML = ''; // clear existing
          reviews.forEach(({ name, course, review }) => {
            addReviewToDOM(name, course, review, false);
          });
        } catch (e) {
          console.error('Failed to parse reviews from localStorage', e);
          reviewsContainer.innerHTML = '';
        }
      } else {
        // If no reviews saved, add a default sample review
        addReviewToDOM(
          'Alice',
          'JavaScript Course',
          'Great course! Helped me a lot.',
          true
        );
      }
    }

    // Add review to the page, and optionally save to localStorage
    function addReviewToDOM(name, course, review, save = true) {
      const colDiv = document.createElement('div');
      colDiv.className = 'col-md-6';

      colDiv.innerHTML = `
        <div class="card review-card p-3">
          <h5 class="card-title">${escapeHtml(name)}</h5>
          <h6 class="card-subtitle mb-2 text-muted">${escapeHtml(course)}</h6>
          <p class="card-text">${escapeHtml(review)}</p>
        </div>
      `;

      reviewsContainer.prepend(colDiv);

      if (save) {
        // Get current reviews from localStorage or empty array
        let currentReviews = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        currentReviews.unshift({ name, course, review });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentReviews));
      }
    }

    // Simple escape to prevent HTML injection in review content
    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Form submission handler
    reviewForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('reviewerName').value.trim();
      const course = document.getElementById('courseName').value.trim();
      const review = document.getElementById('reviewText').value.trim();

      if (name && course && review) {
        addReviewToDOM(name, course, review);

        // Reset form and close modal
        reviewForm.reset();
        const modal = bootstrap.Modal.getInstance(
          document.getElementById('writeReviewModal')
        );
        modal.hide();
      }
    });

    // Initialize
    loadReviews();
  </script>
</body>
</html>
